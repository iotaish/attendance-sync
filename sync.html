<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>出席登録ランチャー — スケジュール共有</title>
  <style>
    :root {
      --color-bg: #f4f6fa;
      --color-card: #ffffff;
      --color-border: #dce2ec;
      --color-primary: #1a73e8;
      --color-primary-hover: #1557b0;
      --color-primary-light: #e8f0fe;
      --color-text: #1a1a2e;
      --color-muted: #5f6368;
      --color-success-text: #137333;
      --radius-lg: 14px;
      --radius-md: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.55;
    }

    .sync-card {
      width: 100%;
      max-width: 520px;
      align-self: flex-start;
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 22px 20px;
      box-shadow: 0 6px 24px rgba(26, 26, 46, 0.06);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sync-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 12px;
    }

    .sync-badge {
      align-self: flex-start;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--color-primary);
      background: var(--color-primary-light);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .sync-title {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .sync-subtitle {
      font-size: 0.85rem;
      color: var(--color-muted);
    }

    .status-banner {
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      border: 1px solid var(--color-border);
      background: var(--color-bg);
    }

    .action-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 700;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.12s, border-color 0.12s;
    }

    .btn-primary {
      background: var(--color-primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--color-primary-hover);
    }

    .btn-outline {
      background: var(--color-card);
      color: var(--color-primary);
      border-color: var(--color-border);
    }

    .btn-outline:hover {
      background: var(--color-primary-light);
      border-color: var(--color-primary);
    }

    .note-text {
      font-size: 0.78rem;
      color: var(--color-muted);
    }

    .fallback-copy-msg {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--color-success-text);
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <main class="sync-card">
    <header class="sync-header">
      <span class="sync-badge">出席登録ランチャー</span>
      <h1 class="sync-title">スケジュール共有</h1>
      <p class="sync-subtitle">URL 内のデータだけで完結するため、スケジュールや設定はサーバーに送信されません。</p>
    </header>

    <p class="status-banner" role="status">
      出席登録ランチャー拡張機能がこのブラウザにインストールされていないか、旧バージョンのままになっています。拡張機能（v3.3.2 以降）を入れたブラウザ（Firefox / Chrome / Edge）でこの共有 URL を開くと、自動で取り込み画面が開きます。
    </p>

    <nav class="action-group" aria-label="代替操作">
      <button type="button" class="btn btn-primary" id="btn-copy-current-url">この共有 URL をコピー</button>
      <a class="btn btn-outline" href="https://github.com/iotaish/attendance_extension/releases/latest" target="_blank" rel="noopener noreferrer">拡張機能（最新リリース）を開く</a>
    </nav>
    <p class="fallback-copy-msg" id="fallback-copy-msg" role="status"></p>
    <p class="note-text">※ アプリ内ブラウザで開いた場合は、メニューから「Firefox で開く」等を選ぶと拡張機能が自動で反応します。</p>
  </main>

  <script>
    (() => {
      const copyBtn = document.getElementById('btn-copy-current-url');
      const msgEl = document.getElementById('fallback-copy-msg');
      if (copyBtn) {
        copyBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(window.location.href);
            if (msgEl) msgEl.textContent = '共有 URL をコピーしました。拡張機能の入ったブラウザで開いてください。';
          } catch (_) {
            if (msgEl) msgEl.textContent = 'コピーできませんでした。アドレスバーの URL を手動でコピーしてください。';
          }
        });
      }
    })();
  </script>
</body>
</html>
