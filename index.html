<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>出席登録ランチャー</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: #f4f6fa;
      color: #1a1a2e;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    main {
      max-width: 460px;
      width: 100%;
      background: #ffffff;
      border: 1px solid #dce2ec;
      border-radius: 14px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
    }

    p {
      margin: 0;
      font-size: 0.9rem;
      color: #5f6368;
      line-height: 1.6;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    a {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 42px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.92rem;
    }

    .primary {
      background: #1a73e8;
      color: #ffffff;
    }

    .secondary {
      border: 1px solid #dce2ec;
      color: #1a73e8;
      background: #ffffff;
    }

<body>
  <main>
    <h1>出席登録ランチャー</h1>

    <nav>
      <a class="primary" href="https://github.com/iotaish/attendance_extension/releases/latest">最新リリース（XPI / ZIP）をダウンロード</a>
      <a class="secondary" href="./sync.html">データ共有・取り込みページへ</a>
    </nav>
  </main>

</html>
